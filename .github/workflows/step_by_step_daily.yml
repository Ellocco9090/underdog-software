name: Step By Step Daily Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    paths:
      - 'step-by-step-data/update_feed.py'
      - '.github/workflows/step_by_step_daily.yml'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests selenium

      - name: Build today and tomorrow feeds
        run: python step-by-step-data/update_feed.py

      - name: Commit feed
        run: |
          git config user.name "step-by-step-bot"
          git config user.email "step-by-step-bot@users.noreply.github.com"
          git add step-by-step-data/latest.json step-by-step-data/*.json
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Update Step By Step daily feed"
          git push
